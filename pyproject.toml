[project]
name = "quickmlops"
version = "0.1.0"
description = "QuickMLOps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-doc",
    "starlette",
    "typing-extensions",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
